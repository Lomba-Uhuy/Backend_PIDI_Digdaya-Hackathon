[project]
name = "etl-worker"
version = "0.1.0"
description = "TradeConnect ETL & Verification Worker — UN Comtrade, BPS, OSS RBA, INATRADE"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Lomba Uhuy Team" }]

dependencies = [
    "celery>=5.4.0",
    "redis>=5.2.0",

    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",

    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "tenacity>=9.0.0",

    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    "pandas>=2.2.3",
    "numpy>=2.1.0",

    "structlog>=24.4.0",
    "orjson>=3.10.10",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","S","A","RET","SIM","TCH","PL","RUF"]
ignore = ["S101", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["etl_worker"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["unit", "integration"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
]
