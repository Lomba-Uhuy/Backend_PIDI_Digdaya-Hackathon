[project]
name = "matching-service"
version = "0.1.0"
description = "TradeConnect AI Matching — HS classifier, pgvector ANN, credibility scoring"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Lomba Uhuy Team" }]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",

    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # DB + pgvector
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",

    # Cache + queue
    "redis>=5.2.0",
    "celery>=5.4.0",

    # AI / ML
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    "numpy>=2.1.0",
    "huggingface-hub>=0.26.0",

    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Utilities
    "orjson>=3.10.10",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matching_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","S","A","RET","SIM","TCH","PL","RUF"]
ignore = ["S101", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["matching_service"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "sentence_transformers.*", "torch.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
markers = ["unit", "integration"]