name: tradeconnect

services:
  # ──────────── INFRASTRUCTURE ────────────
  # Postgres is now hosted on Supabase. This local container is kept for
  # offline / air-gapped development only. Activate with:
  #   docker compose --profile local-db up
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tc_pass_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tradeconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./infra/db/seed-knowledge-base.sql:/docker-entrypoint-initdb.d/01-seed-knowledge-base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tc-net]
    profiles: ["local-db"]

  redis:
    image: redis:7-alpine
    container_name: tc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tc-net]

  # ──────────── NESTJS SERVICES ────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: tc-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      MATCHING_SERVICE_URL: http://matching-service:8001
      COMMS_SERVICE_URL: http://comms-service:8002
      READINESS_SERVICE_URL: http://readiness-service:3002
      BULL_REDIS_URL: redis://redis:6379/2
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [tc-net]
    profiles: ["full"]

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: tc-user-service
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      BULL_REDIS_URL: redis://redis:6379/2
      READINESS_SERVICE_URL: ${READINESS_SERVICE_URL:-http://readiness-service:3002}
      MATCHING_SERVICE_URL: ${MATCHING_SERVICE_URL:-http://matching-service:8001}
      OSS_PUBLIC_NIB_URL: ${OSS_PUBLIC_NIB_URL:-https://api-prd.oss.go.id/v1/reg/public/nib}
      OSS_PUBLIC_USER_KEY: ${OSS_PUBLIC_USER_KEY:-}
      OSS_PUBLIC_RECAPTCHA_RESPONSE: ${OSS_PUBLIC_RECAPTCHA_RESPONSE:-}
      OSS_PUBLIC_COOKIE: ${OSS_PUBLIC_COOKIE:-}
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [tc-net]
    profiles: ["full"]

  readiness-service:
    build:
      context: .
      dockerfile: services/readiness-service/Dockerfile
    container_name: tc-readiness-service
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      INSW_TOKEN: ${INSW_TOKEN:-}
      OSS_PUBLIC_NIB_URL: ${OSS_PUBLIC_NIB_URL:-https://api-prd.oss.go.id/v1/reg/public/nib}
      OSS_PUBLIC_USER_KEY: ${OSS_PUBLIC_USER_KEY:-}
      OSS_PUBLIC_RECAPTCHA_RESPONSE: ${OSS_PUBLIC_RECAPTCHA_RESPONSE:-}
      OSS_PUBLIC_COOKIE: ${OSS_PUBLIC_COOKIE:-}
    ports:
      - "3002:3002"
    depends_on: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [tc-net]
    profiles: ["full"]

  # ──────────── PYTHON SERVICES ────────────
  matching-service:
    build:
      context: ./services/matching-service
      dockerfile: Dockerfile
    container_name: tc-matching-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL_ASYNC: ${DATABASE_URL_ASYNC}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [tc-net]
    profiles: ["full"]

  comms-service:
    build:
      context: ./services/comms-service
      dockerfile: Dockerfile
    container_name: tc-comms-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL_ASYNC: ${DATABASE_URL_ASYNC}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: redis://redis:6379/3
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite,gemini-flash-lite-latest}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [tc-net]
    profiles: ["full"]

  # ──────────── PYTHON WORKERS ────────────
  embedding-worker:
    build:
      context: ./services/matching-service
      dockerfile: Dockerfile
    container_name: tc-embedding-worker
    restart: unless-stopped
    command: ["celery", "-A", "matching_service.infrastructure.workers.celery_app", "worker", "-Q", "ai", "-l", "info", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [tc-net]
    profiles: ["full", "workers"]

  verification-worker:
    build:
      context: ./services/etl-worker
      dockerfile: Dockerfile
    container_name: tc-verification-worker
    restart: unless-stopped
    command: ["celery", "-A", "etl_worker.celery_app", "worker", "-Q", "external", "-l", "info", "--concurrency=4"]
    env_file: .env
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
    depends_on:
      redis:
        condition: service_healthy
    networks: [tc-net]
    profiles: ["full", "workers"]

  etl-worker:
    build:
      context: ./services/etl-worker
      dockerfile: Dockerfile
    container_name: tc-etl-worker
    restart: unless-stopped
    command: ["celery", "-A", "etl_worker.celery_app", "worker", "-Q", "ingest", "-l", "info", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
    depends_on:
      redis:
        condition: service_healthy
    networks: [tc-net]
    profiles: ["full", "workers"]

  # ──────────── ONE-SHOT SEEDERS ────────────
  kb-embedder:
    # Reuses the matching-service image (has google-genai + psycopg[binary])
    # Generates pgvector embeddings for all export_knowledge_base rows via Gemini API.
    # Runs once then exits. Safe to re-run (idempotent).
    build:
      context: ./services/matching-service
      dockerfile: Dockerfile
    container_name: tc-kb-embedder
    restart: "no"
    command: ["python", "/scripts/embed_knowledge_base.py"]
    env_file: .env
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      CHUNK_SIZE: "1800"
      CHUNK_OVERLAP: "200"
    volumes:
      - ./infra/scripts:/scripts:ro
    networks: [tc-net]
    profiles: ["full", "seed"]

  # ──────────── MONITORING ────────────
  flower:
    image: mher/flower:2.0
    container_name: tc-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/4
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks: [tc-net]
    profiles: ["full", "obs"]

volumes:
  postgres_data:
  redis_data:

networks:
  tc-net:
    driver: bridge
