name: CI — Python Services

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/matching-service/**'
      - 'services/comms-service/**'
      - 'services/etl-worker/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/matching-service/**'
      - 'services/comms-service/**'
      - 'services/etl-worker/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [matching-service, comms-service, etl-worker]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tc_test
          POSTGRES_PASSWORD: tc_test
          POSTGRES_DB: tradeconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tc_test"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - name: Setup Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: MyPy
        run: uv run mypy src
        continue-on-error: true   # strict types are aspirational at bootstrap; tighten gradually
      - name: Pytest
        env:
          DATABASE_URL_ASYNC: postgresql+asyncpg://tc_test:tc_test@localhost:5432/tradeconnect_test
          DATABASE_URL_SYNC: postgresql+psycopg://tc_test:tc_test@localhost:5432/tradeconnect_test
          REDIS_URL: redis://localhost:6379/3
          CELERY_BROKER_URL: redis://localhost:6379/4
          CELERY_RESULT_BACKEND: redis://localhost:6379/5
        run: uv run pytest -m unit --cov --cov-report=xml